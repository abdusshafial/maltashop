name: MaltaShop CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest -q
      - name: Build order image
        run: docker build -t maltashop-order:${{ github.sha }} ./order_service
      - name: Build notification image
        run: docker build -t maltashop-notification:${{ github.sha }} ./notification_service
      - name: Verify Compose definition
        run: docker compose config -q
